<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PORO ACADEMY – পড়ো একাডেমি</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f8f6;--card:#fff;--tx:#0f2a21;--mut:#6b7d75;--pri:#059669;--pri2:#d1fae5;--bd:#e3ece7;--sh:0 2px 10px rgba(5,80,50,.08);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1511;--card:#13221b;--tx:#e8f5ee;--mut:#8aa398;--pri:#10b981;--pri2:#0f3a2b;--bd:#1f3329;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1511;--card:#13221b;--tx:#e8f5ee;--mut:#8aa398;--pri:#10b981;--pri2:#0f3a2b;--bd:#1f3329;--sh:none;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:15px/1.45 "Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.fi{width:100%;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:12px;font:inherit;margin-bottom:8px}.lk{color:var(--pri);font-size:13px;cursor:pointer}.lg{height:38px;border-radius:10px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#059669,#34d399);display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px}
.brand{flex:1;line-height:1.1}.brand b{font-size:16px;letter-spacing:.5px}.brand small{display:block;color:var(--mut);font-size:12px}
.ib{width:38px;height:38px;border-radius:12px;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;font-size:17px;position:relative}
.dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:#ef4444}
.pad{padding:0 16px 16px}
h2{font-size:17px;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:center}
h2 a{font-size:13px;color:var(--pri);font-weight:500;cursor:pointer}
.search{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:14px;padding:11px 14px;box-shadow:var(--sh);color:var(--mut)}
.search input{flex:1;border:0;background:none;color:var(--tx);font:inherit;outline:0;min-width:0}
.slider{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px -16px 0;padding:0 16px;scrollbar-width:none}
.slider::-webkit-scrollbar{display:none}
.ban{flex:0 0 88%;scroll-snap-align:center;border-radius:20px;padding:18px;color:#fff;min-height:128px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.ban b{font-size:19px}.ban span{font-size:13px;opacity:.9}.ban em{margin-top:8px;align-self:flex-start;background:#fff;color:#047857;font-style:normal;font-weight:600;padding:5px 14px;border-radius:20px;font-size:13px}
.hs{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{background:var(--card);border-radius:16px;padding:12px 6px;text-align:center;box-shadow:var(--sh);font-size:12.5px;font-weight:500;line-height:1.25}
.cat i{display:grid;place-items:center;width:42px;height:42px;margin:0 auto 6px;border-radius:13px;background:var(--pri2);font-style:normal;font-size:20px}
.cc{flex:0 0 230px;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--sh);text-align:left}
.list .cc{flex:none;display:block;margin-bottom:12px;width:100%}
.cv{height:104px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:700;font-size:18px}
.cb{padding:10px 12px 12px}.cb b{display:block;font-size:14.5px}.cb small{color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.price{color:var(--pri);font-weight:700}.tag{background:var(--pri2);color:var(--pri);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:600}
.btn{background:var(--pri);color:#fff;border-radius:12px;padding:10px 16px;font-weight:600;width:100%}
.btn.o{background:var(--pri2);color:var(--pri)}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--sh);margin-bottom:10px}
.live{display:flex;gap:12px;align-items:center}.live .badge{background:#fee2e2;color:#dc2626;font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:20px;background:var(--card);box-shadow:var(--sh);font-size:13px;font-weight:500}.chip.on{background:var(--pri);color:#fff}
.soc{display:flex;gap:10px}.soc a{text-align:center;text-decoration:none;flex:1;padding:12px;border-radius:14px;color:#fff;font-weight:600;font-size:13px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--mut);padding:4px 0;position:relative}
nav button span{font-size:21px;line-height:1.2}nav button.on{color:var(--pri);font-weight:700}
nav .n{position:absolute;top:0;right:22%;background:#ef4444;color:#fff;border-radius:9px;font-size:10px;min-width:16px;padding:0 4px}
.fab{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:15;background:linear-gradient(135deg,#059669,#10b981);color:#fff;border-radius:26px;padding:12px 18px;font-weight:700;box-shadow:0 6px 18px rgba(5,150,105,.4)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.les{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}.les:last-child{border:0}
.bar{height:7px;border-radius:5px;background:var(--pri2);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pri)}
.msg{padding:10px 12px;border-radius:14px;margin-bottom:8px;max-width:88%;font-size:14px}.msg.u{background:var(--pri);color:#fff;margin-left:auto}.msg.a{background:var(--card);box-shadow:var(--sh)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#064e3b;color:#fff;padding:10px 18px;border-radius:20px;z-index:60;font-size:13.5px;max-width:90%;text-align:center}
.mi{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--bd);width:100%;text-align:left}.mi span:first-child{font-size:20px;width:28px}.mi span:nth-child(2){flex:1}
.cin{display:flex;gap:8px;margin-top:8px}.cin input{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px;font:inherit;min-width:0}
</style>
